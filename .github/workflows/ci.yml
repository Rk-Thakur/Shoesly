on:
  pull_request:
    branches:
      - "shoesly"

  push:
    branches:
      - "shoesly"

name: "Build and Release"
jobs:
  build:
    name: Build and Release"
    runs-on: ubuntu-latest

    strategy:
      matrix:
        project: [packages/shoesly]
      fail-fast: true

    steps:
      - uses: actions/checkout@v1
      - uses: actions/setup-java@v1
        with:
          java-version: "12.x"
      - uses: subosito/flutter-action@v1
        with:
          channel: "stable"

      - name: Flutter pub get
        working-directory: ${{ matrix.project }}
        run: flutter pub get

      - name: Build APK
        if: matrix.project == 'packages/shoesly'
        working-directory: ${{ matrix.project }}
        run: flutter build apk

      - name: Push to Release
        if: matrix.project == 'packages/shoesly'
        uses: ncipollo/release-action@v1
        with:
          artifacts: "packages/shoesly/build/app/outputs/flutter-apk/app-release.apk"
          tag: v1.0.${{ github.run_number }}
          token: ${{ secrets.TOKEN }}

      - name: Build the flutter web app
        if:  matrix.project == 'packages/shoesly'
        working-directory: ${{ matrix.project}}
        run: flutter build web

      - name: Move build project output to docs folder
        run: |
          # rm -rf packages/shoesly/docs
          mv packages/shoesly/build/web packages/shoesly/docs

      - name: Commit and push changes
        run: |
          git config --local user.email "tranjan638@gmail.com"
          git config --local user.name "Rk-Thakur"
          git add docs
          git commit -m "Update GitHub Pages with new build"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }} 