name: shoesly
repository: https://github.com/Rk-Thakur/Shoesly.git

packages:
  - packages/*
scripts:
    analyze: 
        exec: dart analyze .

    format:
      description: Format Dart Code
      run: |
        melos exec -- dart format .
        melos exec -- dart fix --apply

    svg:
      exec: dart run bin/svg.dart
      packageFilters:
        fileExists: bin/svg.dart  

    upgrade:
      description: Pub Upgrade
      exec: flutter pub upgrade

    outdated:
      description: Pub Outdated
      exec: flutter pub outdated

    clean:
      description: Clean all packages
      exec: flutter clean  

  